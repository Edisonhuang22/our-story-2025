<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的信箱 · 大大怪将军与小小怪下士</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥚</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20260923-1">
  <link rel="stylesheet" href="css/mailbox.css?v=20260923-4">
  <link rel="preload" as="image" href="img/gate/girl.png" type="image/png">
  <link rel="preload" as="image" href="img/gate/boy.png" type="image/png">
  <style>
    /* ---------- 彩蛋页 ---------- */
    .egg-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 1.4rem 96px;
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
    }
    .egg-top { text-align: center; }
    .egg-big {
      font-size: 64px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      animation: egg-hatch 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both;
    }
    @keyframes egg-hatch {
      0% { transform: scale(0.2) rotate(-30deg); opacity: 0; }
      60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .egg-kicker {
      margin-top: 1.1rem;
      color: var(--accent-deep);
      font-size: 0.85rem;
      letter-spacing: 0.32em;
      text-indent: 0.32em;
    }
    .egg-title {
      margin-top: 0.6rem;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 900;
      background: linear-gradient(180deg, #c22a63 0%, #ff9fc0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .egg-sub { margin-top: 0.5rem; color: var(--ink-soft); font-size: 0.9rem; }
    .essay {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 2rem 1.8rem 2.2rem;
    }
    .essay-head { text-align: center; margin-bottom: 1.6rem; }
    .essay-date { color: var(--accent); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.14em; }
    .essay-title { margin-top: 0.35rem; font-size: 1.15rem; color: var(--ink); font-weight: 700; }
    .essay-body { display: flex; flex-direction: column; gap: 1.1em; }
    .essay-p { color: #514b5b; font-size: 1.02rem; line-height: 2; text-align: justify; }
    .essay-sign {
      text-align: right;
      color: var(--accent-deep);
      font-weight: 600;
    }
    .egg-back {
      align-self: center;
      text-decoration: none;
      color: var(--accent-deep);
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      padding: 0.65rem 1.4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: #fff;
      transition: filter 0.2s ease;
    }
    .egg-back:hover { filter: brightness(0.97); border-color: var(--accent); }
    .egg-foot { text-align: center; color: #786171; font-size: 0.78rem; letter-spacing: 0.1em; margin-top: 0.2rem; }
    .egg-navigation { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.8rem; }
  </style>
</head>
<body>
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate-card" id="gate-card">
      <p class="gate-kicker">REUNION MISSION</p>
      <h2 class="gate-title" id="gate-title">一起去江西</h2>
      <p class="gate-hint" id="gate-hint">让大大怪学长和小小怪学妹在江西会合。</p>

      <div class="china-stage" id="china-stage">
        <img class="china-map" src="img/gate/china-map.svg" alt="" width="1000" height="850" draggable="false">

        <div class="map-destination" id="jiangxi-target" aria-hidden="true"><span>江西</span></div>
        <button
          class="map-person map-girl"
          id="gate-girl"
          type="button"
          aria-label="小小怪学妹，拖动到江西"
          aria-describedby="gate-hint gate-status"
        >
          <img src="img/gate/girl.png" alt="" width="522" height="478" draggable="false">
          <span class="map-person-name">小小怪学妹</span>
        </button>
        <button
          class="map-person map-boy"
          id="gate-boy"
          type="button"
          aria-label="大大怪学长，拖动到江西"
          aria-describedby="gate-hint gate-status"
        >
          <img src="img/gate/boy.png" alt="" width="528" height="472" draggable="false">
          <span class="map-person-name">大大怪学长</span>
        </button>
        <span class="map-reunion-flare" aria-hidden="true"></span>
      </div>

      <p class="gate-status" id="gate-status" aria-live="polite">把他们都拖到江西 · 也可以使用方向键</p>
    </div>
  </div>

  <main class="egg-page">
    <section class="egg-top">
      <button class="egg-big" id="egg-big" type="button" title="点我一下试试" aria-label="打开彩蛋">🥚</button>
      <p class="egg-kicker">LETTERS BETWEEN US</p>
      <h1 class="mailbox-title">我们的信箱</h1>
      <p class="egg-sub">有些话，写下来，留着慢慢读。</p>
    </section>

    <section id="mailbox-list" aria-labelledby="mailbox-list-title">
      <div class="mailbox-toolbar">
        <div><h2 id="mailbox-list-title" tabindex="-1">收好的信</h2><p id="letter-count"></p></div>
        <button class="small-btn" id="write-letter" type="button">写一封信 ↗</button>
      </div>
      <div class="letter-list" id="letter-list"></div>
      <div class="stack-controls"><button class="mail-link" id="previous-envelope" type="button">← 上一封</button><span id="stack-position" aria-live="polite"></span><button class="mail-link" id="next-envelope" type="button">下一封 →</button></div>
      <button class="draft-link" id="resume-draft" type="button" hidden>继续上次没写完的信 →</button>
      <p class="mailbox-local-note">文字和照片只保存在当前浏览器，不会自动寄给对方。清除浏览器数据会丢失，请保留信件照片原件；电子版可下载留存。</p>
    </section>

    <section class="letter-compose" id="letter-compose" aria-labelledby="compose-title" hidden>
      <div class="mailbox-toolbar"><h2 id="compose-title" tabindex="-1">写一封信</h2><button class="mail-link" id="cancel-letter" type="button">收起，回到信箱</button></div>
      <form id="letter-form">
        <div class="letter-fields">
          <label>写信人<select id="letter-sender"><option>大大怪</option><option>小小怪</option></select></label>
          <label>写信日期<input id="letter-date" type="date" required></label>
        </div>
        <label>信的标题<input id="letter-title" maxlength="80" required placeholder="给这封信起一个名字"></label>
        <label>电子版内容<textarea id="letter-body" rows="12" maxlength="30000" placeholder="慢慢写，也可以只收录实体信照片。"></textarea></label>
        <section class="paper-photos"><h3>实体信件照片</h3><p>可以和电子版一起保存，多页信件按添加顺序展示。</p><input id="compose-photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple aria-label="添加实体信件照片"><div id="compose-photos" class="photo-grid"></div></section>
        <label>关联一段回忆（可选）<select id="letter-memory"><option value="">不关联回忆</option></select></label>
        <div class="letter-form-footer"><button class="small-btn" type="submit">收进信箱</button><span id="draft-status" role="status"></span></div>
      </form>
    </section>

    <section id="letter-reader" aria-label="信件阅读" hidden>
      <div class="mailbox-toolbar reader-toolbar">
        <button class="mail-link" id="back-to-mailbox" type="button">← 回到信箱</button>
        <div class="reader-actions"><button class="mail-link" id="edit-letter" type="button" hidden>修改这封信</button><button class="mail-link" id="download-letter" type="button">下载文字</button></div>
      </div>
      <div id="letter-content" tabindex="-1"></div>
      <section class="paper-photos"><h3>纸上的字迹</h3><p>收好这封信的实体照片，点击可放大阅读。</p><input id="reader-photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple aria-label="为这封信添加实体照片"><div id="reader-photos" class="photo-grid"></div></section>
      <a class="letter-memory-link" id="letter-memory-link" hidden>看看这封信里的回忆 ↗</a>
    </section>
    <p class="mailbox-status" id="mailbox-status" role="status"></p>

    <template id="original-letter">
    <article class="essay">
      <header class="essay-head">
        <p class="essay-date">2026.08.19</p>
        <h2 class="essay-title">小作文</h2>
      </header>
            <div class="essay-body">
        <p class="essay-p">小小学妹陈玉荣</p>
        <p class="essay-p">好久不见喔~</p>
        <p class="essay-p">想不到最终还是被你找到这个入口了，果然小学妹还是聪明！距离上一次写信已经过去好久了，这段时间发生了不少事，特别是在假期我们总会有摩擦，但好在都能选择面对问题好好处理。七夕对你来说肯定还是很意外，虽然以前两个人都说过我们不过这种除了生日以外的节日但是真要到来时我还是会去想好好准备一番，不能以过不过节日来评判对方喜不喜欢，但你这小脑袋肯定会比我更敏感当在朋友圈在其他地方看到别人过七夕，怎么能让你羡慕其他人呢！买礼物你这个笨蛋肯定又想着找个时间“还”给我，索性我就换别的方式继续表达我的爱吼吼。</p>
        <p class="essay-p">每次翻看刚认识那阵子的聊天记录、照片总会感觉很开心，那时候有不开心会直接告诉对方，我们都能体会到对方很强烈的爱意，所以不用去顾虑对方到底喜不喜欢而决定要不要说，后来相处的事情多啦总会有不理解的点，但最重要的还是要信任对方，即使不理解但是也选择信任这样也会很顺很顺哒。人因为顾虑而犹豫做一件事是很正常的，但是只要愿意去做并逐渐的改变那两个人一定是不会走散的。比如我不是很理解为什么能告诉同学朋友但是不能告诉爸妈，但是我相信你一定会告诉爸爸妈妈，所以这件事虽然不理解但是觉得一定会完成所以我就不会因为这种事而内耗而去怀疑我们之间的感情。然后！关于我们什么时候公开我想直接在我去找你的时候我们不避嫌，直接走一起吃一起玩一起！我适应了准备好后找个节日或是去某个地方玩我们就发朋友圈。</p>
        <p class="essay-p">我有想好好在一起，两个人在一起时我也不会喜欢除你以外的其他女生或对其有意思有好感，更不会允许其他女生来刻意接近我，听见了吗！所以你要是吃醋要是怀疑要是不高兴你不要觉得“反正我说了也没用，都是你说‘陈玉荣你该怎么怎么做’”而是要跟我说出来，尽管问题很尖锐但说出来后其实很小，因为我们都喜欢对方啊，当然能够明白对方为什么吃醋而且也愿意去哄，就比如那次我们即使说完了，但是到了第二天我又因为你期末考后吃饭那件事不开心，我觉得我还有话想说，虽然这种两性问题很尖锐但是重点就在于说出来这一瞬间，说出来后其实对方都能领会哒。所以以后不要有说了没用这种想法喔，我也有很多既是优点又是缺点的地方，但我一定是喜欢你的，我会好好改，我们都要好好说话不要把对方越推越远。即使吵得很凶很凶！但是也不要缩小对方之前的好放大对方的不好。</p>
        <p class="essay-p">讲到这里也差不多该结束啦，以后还有很长很长一起陪伴的日子，我们要好好哒，大胆把爱告诉对方、相信对方。这是我第一次做网站，做的还很粗糙，特别是图片要加载好久好久，以及这些排版也没达到我真正想要体现的样子，以后一点一点继续优化~</p>
        <p class="essay-p">纸短情长，不尽依依</p>
        <p class="essay-p essay-sign">——皇叔皇叔</p>
      </div>
    </article>
    </template>

    <div class="egg-navigation">
      <a class="egg-back" href="index.html?resume=1#photos">← 继续看回忆</a>
      <a class="egg-back" href="index.html">回到故事首页</a>
    </div>
    <p class="egg-foot">P.S. 能找到这里的人，一定认真看到了最后吧。</p>
  </main>

  <div id="hearts" aria-hidden="true"></div>

  <script src="js/gate.js?v=20260923-1"></script>
  <dialog id="photo-viewer"><div class="photo-viewer-toolbar"><button id="photo-previous" type="button">上一页</button><span id="photo-page"></span><button id="photo-next" type="button">下一页</button><button id="photo-zoom" type="button">查看原尺寸</button><button id="photo-close" type="button">关闭 ×</button></div><div class="photo-viewer-scroll"><img id="photo-full" alt="实体信件照片"></div></dialog>
  <script src="js/mailbox.js?v=20260923-4"></script>
  <script>
    document.body.classList.add('loaded');

    /* 点一下鸡蛋孵小鸡 */
    (function initEggClick() {
      var egg = document.getElementById('egg-big');
      var flipped = false;
      egg.addEventListener('click', function () {
        flipped = !flipped;
        egg.textContent = flipped ? '🐣' : '🥚';
      });
    })();

    /* 爱心粒子 */
    (function makeHearts() {
      var layer = document.getElementById('hearts');
      for (var i = 0; i < 10; i++) {
        var h = document.createElement('span');
        h.className = 'heart';
        h.textContent = '♥';
        h.style.left = (Math.random() * 100) + '%';
        h.style.fontSize = (8 + Math.random() * 10) + 'px';
        h.style.animationDuration = (11 + Math.random() * 12) + 's';
        h.style.animationDelay = (-Math.random() * 20) + 's';
        layer.appendChild(h);
      }
    })();
  </script>
</body>
</html>
